# Public lists of SWE-bench Verified tasks that someone else has reported as
# problematic. Each list was opened and read when this file was written; the
# audit script intersects them with the tasks itemaudit flags.

openai_infra_23:
  description: >-
    Tasks OpenAI omitted from its SWE-bench Verified runs because their
    solutions "could not run on our infrastructure" (23 of 500).
  source: >-
    OpenAI, "Introducing GPT-4.1 in the API" (14 April 2025), footnote 2,
    https://openai.com/index/gpt-4-1/ read through the Internet Archive
    snapshot https://web.archive.org/web/20250415150007/https://openai.com/index/gpt-4-1/
  tasks:
    - astropy__astropy-7606
    - astropy__astropy-8707
    - astropy__astropy-8872
    - django__django-10097
    - django__django-7530
    - matplotlib__matplotlib-20488
