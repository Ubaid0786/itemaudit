openai_2026_flawed_test_examples:
  description: >-
    The three tasks OpenAI names as examples of flawed tests in its 2026
    audit (tests that import a function name the issue never mentions, tests
    covering issues the task description leaves out, tests requiring an
    unspecified parameter). The audit covered 138 tasks and reports material
    issues in 59.4% of them, but the full list is not published.
  source: >-
    OpenAI, "Why SWE-bench Verified no longer measures frontier coding
    capabilities" (23 February 2026),
    https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/
    read through the Internet Archive snapshot
    https://web.archive.org/web/20260224082405/https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/
  tasks:
    - pylint-dev__pylint-4551
    - sympy__sympy-18199
    - django__django-14725

utboost_insufficient_tests:
  description: >-
    Tasks for which UTBoost confirmed augmented test cases because the
    original tests let incorrect patches pass (36 ids across SWE-bench Lite
    and Verified; the script keeps those that are in Verified). These are
    tasks that are too easy to pass, a different defect from the ones
    discrimination statistics look for.
  source: >-
    Yu, Zhu, He and Kang, "UTBoost: Rigorous Evaluation of Coding Agents on
    SWE-Bench" (arXiv:2506.09289); list taken from
    assets/useful_scripts/augTest.json in
    https://github.com/CUHK-Shenzhen-SE/UTBoost at commit
    4f32782517f23940d3ede8cd1f250667873cc0c6
